[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "salah-tui"
version = "0.1.0"
description = "A terminal user interface (TUI) for Islamic prayer times with live countdown and Qibla direction in Dracula theme."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "postsonde" },
]
keywords = ["salah", "namaz", "prayer-times", "qibla", "islam", "tui", "terminal", "textual", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Religion",
]
dependencies = [
    "httpx>=0.27.0",
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/postsonde/salah-tui"
Repository = "https://github.com/postsonde/salah-tui"
Issues = "https://github.com/postsonde/salah-tui/issues"

[project.scripts]
salah = "salah_tui:main"

[tool.setuptools]
py-modules = ["salah_tui"]
